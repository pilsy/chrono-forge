name: Node.js Package

# Publishing is a manual run: Actions > Node.js Package > Run workflow, on `main`.
# It publishes each package only when npm doesn't have package.json's version yet and the Test Suite passed for that
# exact commit on a push to main. The git tag and GitHub release follow a successful publish. A merge never publishes
# by itself.
#
# npm authenticates with trusted publishing (OIDC), so no npm token is stored in the repository. Each package
# (chrono-forge and temporal-forge) needs a trusted publisher on npmjs.com: user `pilsy`, repository `chrono-forge`,
# workflow filename `npm-publish.yml`. package.json `repository.url` must match this repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  version-check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      publish_chrono: ${{ steps.check_version.outputs.publish_chrono }}
      publish_temporal: ${{ steps.check_version.outputs.publish_temporal }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get current version
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Require a passing Test Suite run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow run-tests.yml --commit "$GITHUB_SHA" \
            --event push --status success --json databaseId --jq 'length')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::No successful Test Suite run for $GITHUB_SHA on a push to main"
            exit 1
          fi
        shell: bash

      # npm, not the git tag, decides: a tag created by a run whose publish failed must not block the next run.
      - name: Check which packages need this version
        id: check_version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          need() { if npm view "$1@$CURRENT_VERSION" version >/dev/null 2>&1; then echo false; else echo true; fi; }
          chrono=$(need chrono-forge)
          temporal=$(need temporal-forge)
          echo "chrono-forge@$CURRENT_VERSION needs publishing: $chrono; temporal-forge: $temporal"
          echo "publish_chrono=$chrono" >> "$GITHUB_OUTPUT"
          echo "publish_temporal=$temporal" >> "$GITHUB_OUTPUT"
          if [ "$chrono" = true ] || [ "$temporal" = true ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  publish-npm-chrono:
    if: ${{ needs.version-check.outputs.publish_chrono == 'true' }}
    runs-on: ubuntu-latest
    needs: version-check
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1 or later and an OIDC token from GitHub (id-token: write).
      - run: npm install -g npm@11
      - name: Check npm version and OIDC
        run: |
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available: id-token: write is missing for this job"
            exit 1
          fi
          echo "OIDC token request URL is set"
        shell: bash
      - run: npm ci
      - run: npm publish --loglevel verbose

  publish-npm-temporal:
    if: ${{ needs.version-check.outputs.publish_temporal == 'true' }}
    runs-on: ubuntu-latest
    needs: version-check
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@11
      - name: Check npm version and OIDC
        run: |
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available: id-token: write is missing for this job"
            exit 1
          fi
          echo "OIDC token request URL is set"
        shell: bash
      - run: npm ci
      - run: |
          jq '.name = "temporal-forge"' package.json > temp.json && mv temp.json package.json
          npm run clean
          npm publish --loglevel verbose

  create-tag:
    # After both publishes succeed (or were not needed). Skips the tag and release if they already exist.
    if: ${{ !cancelled() && needs.version-check.outputs.version_changed == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    needs: [version-check, publish-npm-chrono, publish-npm-temporal]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git tag
        env:
          VERSION: ${{ needs.version-check.outputs.current_version }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists."
          else
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi
        shell: bash

      - name: Create Release
        env:
          VERSION: ${{ needs.version-check.outputs.current_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags
          LAST_VERSION=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -n 1)
          if [ -z "$LAST_VERSION" ]; then
            LAST_VERSION="initial"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          gh release create "$VERSION" --title "Release $VERSION" \
            --notes "See CHANGELOG.md. Changes: https://github.com/${{ github.repository }}/compare/$LAST_VERSION...$VERSION"
        shell: bash
